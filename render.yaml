# Blueprint de Render: crea el Web Service y la base de datos PostgreSQL
# y los conecta automáticamente (DATABASE_URL).
databases:
  - name: estudiantes-db
    plan: free
    databaseName: estudiantes
    user: estudiantes

services:
  - type: web
    name: registro-estudiantes
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estudiantes-db
          property: connectionString
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
